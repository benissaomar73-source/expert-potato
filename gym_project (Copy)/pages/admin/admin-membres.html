<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerFit DZ - Gestion des Membres</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

    <!-- ===== EN-TÊTE ET NAVIGATION ===== -->
    <header>
        <nav>
            <div class="logo">Power<span>Fit</span> DZ <span class="badge" style="background:var(--danger); color:white; font-size:0.8rem; margin-left:10px; padding: 4px 8px; vertical-align: middle;">ADMIN</span></div>
            <div class="nav-links">
                <a href="admin-dashboard.html">Dashboard</a>
                <a href="admin-membres.html" class="active">Membres</a>
                <a href="admin-plans.html">Plans</a>
                <a href="admin-cours.html">Cours</a>
                <a href="../guest/index.html">Voir le Site</a>
                <a href="admin-login.html" style="color: var(--danger);">Déconnexion</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="bg-light">
            <div class="container">
                <div class="d-flex justify-between align-center mb-4">
                    <h1 class="section-title" style="text-align: left; margin: 0;">Gestion des Membres</h1>
                    <button class="btn" id="btn-ouvrir-ajout" style="font-size: 0.9rem; padding: 0.6rem 1.2rem;">+ Ajouter un Membre</button>
                </div>

                <!-- TABLEAU MEMBRES -->
                <div class="card mb-4" id="tableau-membres-section">
                    <div class="grid grid-3 mb-4 align-center">
                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="recherche-membre" class="form-label" style="margin-bottom: 0.2rem;">Rechercher</label>
                            <input type="text" id="recherche-membre" placeholder="Nom ou email..." class="form-control">
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="filtre-plan-membre" class="form-label" style="margin-bottom: 0.2rem;">Filtrer par plan</label>
                            <select id="filtre-plan-membre" class="form-control">
                                <option value="">Tous les plans</option>
                                <option value="Bronze">Bronze</option>
                                <option value="Silver">Silver</option>
                                <option value="Gold">Gold</option>
                            </select>
                        </div>
                        <div class="d-flex align-center justify-end" style="height: 100%; margin-top: 1.5rem;">
                            <span id="compteur-membres" style="color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.9rem; background: #f1f5f9; padding: 0.5rem 1rem; border-radius: 8px;">Total : 0 membre(s)</span>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table-lg">
                            <thead>
                                <tr><th>#</th><th>Nom</th><th>Email</th><th>Téléphone</th><th>Plan</th><th>Date d'inscription</th><th style="text-align: right;">Actions</th></tr>
                            </thead>
                            <tbody id="tableau-membres">
                                <!-- Rempli par admin-membres.js -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <!-- MODAL POUR AJOUTER UN MEMBRE -->
    <div id="modal-ajouter-membre" class="modal-overlay">
        <div class="modal-content" style="max-width: 600px;">
            <button id="fermer-modal-ajout" class="btn-close-modal" style="position:absolute; top:15px; right:20px; background:none; border:none; font-size:24px; cursor:pointer; color:var(--text-muted);">&times;</button>
            <h2 class="mb-4">Ajouter un Nouveau Membre</h2>
            <form id="form-ajouter-membre">
                <div class="grid grid-2">
                    <div class="form-group">
                        <label for="new-nom" class="form-label">Nom complet *</label>
                        <input type="text" id="new-nom" class="form-control" placeholder="Ex: Mehdi Saïdi" required>
                    </div>
                    <div class="form-group">
                        <label for="new-email" class="form-label">Email *</label>
                        <input type="email" id="new-email" class="form-control" placeholder="m.saidi@gmail.com" required>
                    </div>
                    <div class="form-group">
                        <label for="new-telephone" class="form-label">Téléphone *</label>
                        <input type="tel" id="new-telephone" class="form-control" placeholder="0555123456" required>
                    </div>
                    <div class="form-group">
                        <label for="new-plan" class="form-label">Plan *</label>
                        <select id="new-plan" class="form-control" required>
                            <option value="">-- Choisir --</option>
                            <option value="Bronze">Bronze</option>
                            <option value="Silver">Silver</option>
                            <option value="Gold">Gold</option>
                        </select>
                    </div>
                </div>
                <div class="d-flex gap-4 mt-4">
                    <button type="submit" class="btn">Ajouter le Membre</button>
                    <button type="button" id="btn-annuler-ajout" class="btn btn-outline" style="color:var(--text-muted); border-color:var(--border);">Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL POUR MODIFIER UN MEMBRE -->
    <div id="modal-modifier-membre" class="modal-overlay">
        <div class="modal-content" style="max-width: 600px;">
            <button id="fermer-modal-membre" class="btn-close-modal" style="position:absolute; top:15px; right:20px; background:none; border:none; font-size:24px; cursor:pointer; color:var(--text-muted);">&times;</button>
            <h2 class="mb-4">Modifier le Membre</h2>
            <form id="form-modifier-membre">
                <input type="hidden" id="edit-id">
                <div class="grid grid-2">
                    <div class="form-group">
                        <label for="edit-nom" class="form-label">Nom complet *</label>
                        <input type="text" id="edit-nom" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-email" class="form-label">Email *</label>
                        <input type="email" id="edit-email" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-telephone" class="form-label">Téléphone *</label>
                        <input type="tel" id="edit-telephone" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-plan" class="form-label">Plan *</label>
                        <select id="edit-plan" class="form-control" required>
                            <option value="Bronze">Bronze</option>
                            <option value="Silver">Silver</option>
                            <option value="Gold">Gold</option>
                        </select>
                    </div>
                </div>
                <div class="d-flex gap-4 mt-4">
                    <button type="submit" class="btn">Enregistrer</button>
                    <button type="button" id="btn-annuler-edit" class="btn btn-outline" style="color:var(--text-muted); border-color:var(--border);">Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== PIED DE PAGE ===== -->
    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2025 PowerFit DZ – Interface d'Administration. Tous droits réservés.</p>
            </div>
        </div>
    </footer>

    <script src="../../js/admin-membres.js"></script>

</body>
</html>
